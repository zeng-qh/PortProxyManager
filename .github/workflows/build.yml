name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish win-x86 (self-contained)
        run: dotnet publish PortProxyManager.csproj -c Release -r win-x86 --self-contained true -o dist/win-x86

      - name: Publish win-x64 (self-contained)
        run: dotnet publish PortProxyManager.csproj -c Release -r win-x64 --self-contained true -o dist/win-x64

      - name: Publish framework-dependent
        run: dotnet publish PortProxyManager.csproj -c Release -o dist/framework-dependent

      - name: Include launcher
        shell: cmd
        run: |
          copy /y start-admin.bat dist\win-x86\
          copy /y start-admin.bat dist\win-x64\
          copy /y start-admin.bat dist\framework-dependent\

      - name: Pack zips
        shell: pwsh
        run: |
          Compress-Archive -Path dist/win-x86/* -DestinationPath dist/PortProxyManager-win-x86.zip -Force
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/PortProxyManager-win-x64.zip -Force
          Compress-Archive -Path dist/framework-dependent/* -DestinationPath dist/PortProxyManager-framework-dependent.zip -Force
          Get-ChildItem dist/*.zip | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PortProxyManager-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
